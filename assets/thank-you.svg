<svg xmlns="http://www.w3.org/2000/svg" width="800" height="240" viewBox="0 0 800 240" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="t" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00e5ff"><animate attributeName="stop-color" values="#00e5ff;#ff00cc;#ffd200;#00e676;#00e5ff" dur="6s" repeatCount="indefinite"/></stop>
      <stop offset="1" stop-color="#ff00cc"><animate attributeName="stop-color" values="#ff00cc;#ffd200;#00e676;#00e5ff;#ff00cc" dur="6s" repeatCount="indefinite"/></stop>
    </linearGradient>
  </defs>
  <text x="60" y="215" font-size="22" opacity="0">❤
    <animate attributeName="y" values="215;20" dur="4s" begin="0s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;0.9;0" dur="4s" begin="0s" repeatCount="indefinite"/>
  </text>
  <text x="150" y="215" font-size="18" opacity="0">❤
    <animate attributeName="y" values="215;20" dur="5s" begin="1s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;0.9;0" dur="5s" begin="1s" repeatCount="indefinite"/>
  </text>
  <text x="260" y="215" font-size="26" opacity="0">❤
    <animate attributeName="y" values="215;20" dur="4.5s" begin="0.5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;0.9;0" dur="4.5s" begin="0.5s" repeatCount="indefinite"/>
  </text>
  <text x="540" y="215" font-size="20" opacity="0">❤
    <animate attributeName="y" values="215;20" dur="5s" begin="1.5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;0.9;0" dur="5s" begin="1.5s" repeatCount="indefinite"/>
  </text>
  <text x="640" y="215" font-size="26" opacity="0">❤
    <animate attributeName="y" values="215;20" dur="4s" begin="0.8s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;0.9;0" dur="4s" begin="0.8s" repeatCount="indefinite"/>
  </text>
  <text x="730" y="215" font-size="18" opacity="0">❤
    <animate attributeName="y" values="215;20" dur="4.8s" begin="2.2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;0.9;0" dur="4.8s" begin="2.2s" repeatCount="indefinite"/>
  </text>
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -8;0 0" dur="3s" repeatCount="indefinite"/>
    <text x="400" y="105" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="92" font-weight="800" fill="url(#t)" stroke="#ffffff" stroke-width="1" stroke-opacity="0.25">THANK YOU
      <animate attributeName="opacity" values="0.75;1;0.75" dur="2.4s" repeatCount="indefinite"/>
    </text>
    <text x="400" y="165" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="30" font-weight="600" fill="url(#t)">For Using My Fork ✨
      <animate attributeName="opacity" values="1;0.6;1" dur="2.4s" repeatCount="indefinite"/>
    </text>
  </g>
</svg>
