<svg xmlns="http://www.w3.org/2000/svg" width="260" height="84" viewBox="0 0 260 84" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2AABEE"/><stop offset="1" stop-color="#1c7fc0"/>
    </linearGradient>
    <clipPath id="c"><rect x="6" y="10" width="248" height="64" rx="32"/></clipPath>
  </defs>
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -4;0 0" dur="2s" repeatCount="indefinite"/>
    <rect x="6" y="10" width="248" height="64" rx="32" fill="none" stroke="#2AABEE" stroke-width="3">
      <animate attributeName="opacity" values="0.2;1;0.2" dur="2s" repeatCount="indefinite"/>
    </rect>
    <rect x="6" y="10" width="248" height="64" rx="32" fill="url(#g)"/>
    <g clip-path="url(#c)">
      <rect x="-80" y="0" width="50" height="90" fill="#ffffff" opacity="0.28" transform="skewX(-20)">
        <animate attributeName="x" values="-80;320" dur="2.6s" repeatCount="indefinite"/>
      </rect>
    </g>
    <text x="52" y="52" font-size="30" text-anchor="middle">✈️</text>
    <text x="96" y="51" font-family="Segoe UI, Arial, sans-serif" font-size="26" font-weight="700" fill="#ffffff">Telegram</text>
  </g>
</svg>
