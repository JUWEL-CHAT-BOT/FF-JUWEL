<svg xmlns="http://www.w3.org/2000/svg" width="320" height="84" viewBox="0 0 320 84" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0099FF"/><stop offset="1" stop-color="#A334FA"/>
    </linearGradient>
    <clipPath id="c"><rect x="6" y="10" width="308" height="64" rx="32"/></clipPath>
  </defs>
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -4;0 0" dur="2s" repeatCount="indefinite"/>
    <rect x="6" y="10" width="308" height="64" rx="32" fill="none" stroke="#0099FF" stroke-width="3">
      <animate attributeName="opacity" values="0.2;1;0.2" dur="2s" repeatCount="indefinite"/>
    </rect>
    <rect x="6" y="10" width="308" height="64" rx="32" fill="url(#g)"/>
    <g clip-path="url(#c)">
      <rect x="-80" y="0" width="50" height="90" fill="#ffffff" opacity="0.28" transform="skewX(-20)">
        <animate attributeName="x" values="-80;380" dur="2.6s" repeatCount="indefinite"/>
      </rect>
    </g>
    <text x="52" y="52" font-size="30" text-anchor="middle">👥</text>
    <text x="84" y="51" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="700" fill="#ffffff">Messenger Support Group</text>
  </g>
</svg>
